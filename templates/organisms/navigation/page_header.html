{% from "molecules/navigation/breadcrumb_list.html" import breadcrumb_list %}

{% macro page_header(title, breadcrumbs=[], actions=[]) %}
<div class="d-flex justify-content-between align-items-start mb-4">
    <div>
        {{ breadcrumb_list(breadcrumbs) }}
        <h1 class="mt-2">{{ title }}</h1>
    </div>
    {% if actions %}
    <div class="d-flex gap-2">
        {% for action in actions %}
        <button type="button" class="btn {{ action.class|default('btn-secondary') }}" 
                {% if action.onclick %}onclick="{{ action.onclick }}"{% endif %}>
            {{ action.text }}
        </button>
        {% endfor %}
    </div>
    {% endif %}
</div>
{% endmacro %}
