{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1 class="mb-4">Konomi REPL</h1>
        <div class="card">
            <div class="card-body">
                <div id="output" class="mb-3 p-3 bg-dark rounded" style="height: 300px; overflow-y: auto;">
                    Welcome to Konomi REPL!
                    Try these commands:
                    > let name = "Alice"
                    > ask "What is the weather?"
                </div>
                <div class="input-group">
                    <input type="text" id="input" class="form-control" placeholder="Enter Konomi code...">
                    <button class="btn btn-primary" onclick="executeCode()">Run</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/repl.js') }}"></script>
{% endblock %}
