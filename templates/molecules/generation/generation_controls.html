<div class="generation-controls">
    <div class="flex space-x-4 items-center">
        <div class="flex-1">
            {% include "atoms/form/generation_input.html" %}
        </div>
        <div class="flex-none">
            <button
                type="submit"
                class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                id="generate-button"
            >
                Generate
            </button>
        </div>
    </div>
    <div class="mt-4">
        <label class="block text-sm font-medium text-gray-700">Generation Settings</label>
        <div class="mt-2 grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs text-gray-500">Model</label>
                <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                    <option value="gpt-4">GPT-4</option>
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500">Temperature</label>
                <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.1"
                    value="0.7"
                    class="mt-1 block w-full"
                >
            </div>
        </div>
    </div>
</div>
