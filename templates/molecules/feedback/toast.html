{% macro toast(title, message, autohide=true) %}
<div class="toast" role="alert" aria-live="assertive" aria-atomic="true" {% if autohide %}data-bs-autohide="true"{% endif %}>
    <div class="toast-header">
        <strong class="me-auto">{{ title }}</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body">
        {{ message }}
    </div>
</div>
{% endmacro %}
