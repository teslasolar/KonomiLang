{% macro checkbox(id="", name="", label="", checked=false, required=false) %}
<div class="form-check">
    <input 
        type="checkbox" 
        class="form-check-input" 
        id="{{ id }}"
        name="{{ name }}"
        {% if checked %}checked{% endif %}
        {% if required %}required{% endif %}
    >
    <label class="form-check-label" for="{{ id }}">
        {{ label }}
    </label>
</div>
{% endmacro %}
