<div class="api-key-config">
    <div class="bg-white p-4 rounded-md border border-gray-200">
        <h3 class="text-lg font-medium text-gray-900 mb-4">API Configuration</h3>
        <div class="space-y-4">
            <div>
                <label for="api-key" class="block text-sm font-medium text-gray-700">OpenAI API Key</label>
                <div class="mt-1 flex rounded-md shadow-sm">
                    <input
                        type="password"
                        id="api-key"
                        name="api_key"
                        class="flex-1 rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500"
                        placeholder="Enter your OpenAI API key"
                    >
                    <button
                        type="button"
                        id="toggle-api-key"
                        class="ml-2 inline-flex items-center px-3 py-2 border border-gray-300 shadow-sm text-sm leading-4 font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                    >
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="flex items-center justify-between">
                <button
                    type="button"
                    id="save-api-key"
                    class="inline-flex items-center px-3 py-2 border border-transparent text-sm leading-4 font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                >
                    Save API Key
                </button>
                <button
                    type="button"
                    id="test-api-key"
                    class="inline-flex items-center px-3 py-2 border border-gray-300 shadow-sm text-sm leading-4 font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                >
                    Test Connection
                </button>
            </div>
        </div>
    </div>
</div>
