<div class="generation-type-selector">
    <label for="generation-type" class="block text-sm font-medium text-gray-700">Generation Type</label>
    <select
        id="generation-type"
        name="generation_type"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
    >
        <option value="completion">Text Completion</option>
        <option value="chat">Chat</option>
        <option value="code">Code Generation</option>
        <option value="analysis">Content Analysis</option>
    </select>
</div>
