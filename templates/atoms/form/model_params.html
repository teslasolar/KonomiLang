<div class="model-params space-y-4">
    <div>
        <label for="max-tokens" class="block text-sm font-medium text-gray-700">Max Tokens</label>
        <input
            type="number"
            id="max-tokens"
            name="max_tokens"
            min="1"
            max="4096"
            value="2048"
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
        >
    </div>
    <div>
        <label for="temperature" class="block text-sm font-medium text-gray-700">Temperature</label>
        <div class="flex items-center space-x-2">
            <input
                type="range"
                id="temperature"
                name="temperature"
                min="0"
                max="2"
                step="0.1"
                value="0.7"
                class="flex-1"
            >
            <span id="temperature-value" class="text-sm text-gray-500">0.7</span>
        </div>
    </div>
    <div>
        <label for="top-p" class="block text-sm font-medium text-gray-700">Top P</label>
        <div class="flex items-center space-x-2">
            <input
                type="range"
                id="top-p"
                name="top_p"
                min="0"
                max="1"
                step="0.05"
                value="1"
                class="flex-1"
            >
            <span id="top-p-value" class="text-sm text-gray-500">1.0</span>
        </div>
    </div>
    <!-- Complexity Analysis Parameters -->
    <div class="complexity-analysis-params hidden">
        <div>
            <label for="complexity-level" class="block text-sm font-medium text-gray-700">Complexity Level</label>
            <select
                id="complexity-level"
                name="complexity_level"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"
            >
                <option value="basic">Basic</option>
                <option value="detailed">Detailed</option>
                <option value="comprehensive">Comprehensive</option>
            </select>
        </div>
        <div class="mt-4">
            <label for="analysis-metrics" class="block text-sm font-medium text-gray-700">Analysis Metrics</label>
            <div class="mt-2 space-y-2">
                <div class="flex items-center">
                    <input type="checkbox" id="cyclomatic-complexity" name="metrics[]" value="cyclomatic" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                    <label for="cyclomatic-complexity" class="ml-2 text-sm text-gray-700">Cyclomatic Complexity</label>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="cognitive-complexity" name="metrics[]" value="cognitive" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                    <label for="cognitive-complexity" class="ml-2 text-sm text-gray-700">Cognitive Complexity</label>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="maintainability-index" name="metrics[]" value="maintainability" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                    <label for="maintainability-index" class="ml-2 text-sm text-gray-700">Maintainability Index</label>
                </div>
            </div>
        </div>
    </div>
</div>
