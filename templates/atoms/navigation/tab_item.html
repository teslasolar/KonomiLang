{% macro tab_item(id="", text="", active=false) %}
<button 
    class="nav-link {% if active %}active{% endif %}" 
    id="{{ id }}-tab" 
    data-bs-toggle="tab" 
    data-bs-target="#{{ id }}-pane" 
    type="button" 
    role="tab" 
    aria-controls="{{ id }}-pane" 
    aria-selected="{{ 'true' if active else 'false' }}"
>
    {{ text }}
</button>
{% endmacro %}
